schema_version: "1.0"
status: shadow
updated: "2026-07-31"
purpose: "AI 论文速记字幕/口播双轨术语真源"

policy:
  brands_models_frameworks: keep_standard_english_pronunciation
  technical_concepts: chinese_first
  numbers: natural_spoken_chinese
  acronyms: spell_letters_then_add_chinese_function
  subtitle_voice_alignment: semantic_one_to_one
  provider_overrides: require_short_listening_review

notes:
  - "speak_default 描述发音目标，不承诺任一 TTS provider 会自动读对。"
  - "provider_overrides 只有经过对应音色短审后才能填写并锁定。"
  - "字幕保留标准拼写；配音可中文化，但不得改变事实、数字、基线或限定条件。"
  - "Codex 的 Code X 等拆词写法只作为 provider 候选，未经短审不得成为默认。"

